[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]

[project]
name = "grading"
version = "0.1.0"
description = "Grading system for Archipelago"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aioboto3>=15.4.0",
    "aiobotocore>=2.25.0",
    "zstandard>=0.23.0",
    "duckdb>=1.0.0",
    "firecrawl-py>=1.0.0",
    "jsonpath-ng>=1.6.0",
    "litellm==1.84.0",
    "loguru>=0.7.3",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "google-auth>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "redis>=6.4.0",
    "tenacity>=9.0.0",
    "datadog-api-client>=2.44.0",
    "pdf2image>=1.17.0",
    "pypdf>=6.9.2",
    "pillow==12.2.0",
    "types-aioboto3>=15.2.0",
    "types-aiobotocore[s3]>=2.15.2",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "xls2xlsx>=0.2.0",
    "python-pptx>=0.6.23",
    "python-docx>=1.1.0",
    "lxml>=5.0.0",
    "icalendar>=6.1.0",
    "sqlglot>=30.0.0",
    "pydicom>=3.0.0",                # For DICOM file parsing in normalizer
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "formulas>=1.2.0",               # For evaluating Spreadsheets formulas in spreadsheet_verifier
    "playwright>=1.49.0",            # Drives a live headless browser in bua_verifier
    "claude-agent-sdk==0.2.121",
    "google-antigravity==0.1.11",
    "mcp>=1.23.0,<2",
    "transformers==5.10.2",
    "sentencepiece==0.2.1",
    "datasketch==2.0.0",           # HarmBench copyright MinHash grader
    "spacy==3.8.16",
    "en-core-web-sm==3.8.0",
    "cadquery-ocp-novtk>=7.9.3.1,<8",  # OCCT kernel bindings for cad_llm_judge probes (no VTK)
    "trimesh>=5,<6",                   # mesh measurement + tessellation for cad_llm_judge
    "rtree>=1.3",                      # trimesh proximity/ray queries (cad_llm_judge probes)
    "scipy>=1.14",                     # trimesh ICP alignment for cad_llm_judge golden compare
    "cadquery==2.8.0",                 # cadbench_geometry runs model CadQuery code; VTK deps dropped below
    "manifold3d>=3.5,<4",              # trimesh boolean engine for cadbench_geometry IoU
    "pymeshlab==2025.7.post1",         # alpha-wrap before cadbench_geometry IoU, as upstream CADBench does
    "pylatexenc==2.10",                # LaTeX-to-text for MonitorBench's vendored DeepScaleR grader
    "sympy==1.13.3",                   # MonitorBench's DeepScaleR grader imports it at load time; same pin as data-science
    "rouge-score==0.1.2",
    "nltk==3.10.3",
    "langdetect==1.0.9",
    "immutabledict==4.2.2",
    "absl-py==2.3.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.34.0",
    "pandas==2.2.3",
    "ruff>=0.14.5",
    "pytest-testmon>=2.1.0",
    "pytest-xdist>=3.0.0",
    "reportlab>=4.0.0",
    "types-lxml>=2024.0.0",
]
data-science = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "matplotlib==3.9.2",
    "scikit-learn==1.5.2",
    "xgboost==2.1.1",
    "imbalanced-learn==0.12.4",
    "statsmodels==0.14.4",
    "scipy==1.17.1",
    "h5py==3.12.1",
    "sympy==1.13.3",  # SciCode problem 17's required_dependencies needs this
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.uv]
exclude-newer = "7 days"
# index. The rolling cooldown exists to blunt supply-chain attacks on public
# PyPI, which does not apply here, so it is exempted outright rather than
# re-pinned on every release. Paired with the `>=` floor in dependencies: a
# re-lock picks up the newest client with no pyproject edit.
# google-antigravity 0.1.11 is the first release with BudgetConfig, which is how
# the antigravity harness caps turns. It was published inside the 7-day window,
# so resolution needs this override until the window moves past 2026-08-13.
exclude-newer-package = {  google-antigravity = "2026-08-14T00:00:00Z" }
# cadquery hard-depends on the VTK OCP build and its viewer stack; the grader uses
# cadquery-ocp-novtk and stubs the VTK imports (runner/evals/cadbench_geometry/vtk_stub.py).
override-dependencies = [
    "cadquery-ocp; sys_platform == 'never'",
    "vtk; sys_platform == 'never'",
    "trame; sys_platform == 'never'",
    "trame-vtk; sys_platform == 'never'",
    "trame-components; sys_platform == 'never'",
    "trame-vuetify; sys_platform == 'never'",
    "numba; sys_platform == 'never'",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
ignore = [
    "runner/evals/iheval_programmatic/vendor",
]
reportUnusedCallResult = "none"
failOnWarnings = false
exclude = [
    # modal is not a dependency of this package; CI injects it with
    # `uv run --with modal`, so anything importing it cannot type-check here.
    "modal_labs.py",
    "modal_helpers.py",
    "modal_codeartifact.py",
    "build_mountable_image.py",
    "record_grading_image.py",
    # Vendored upstream grader, kept as upstream wrote it.
    "runner/evals/monitorbench/math_grader.py",
    ".venv",
    ".git",
    ".tmp",
    "venv",
    "runner/evals/iheval_programmatic/vendor",
    "runner/helpers/vera_mh_result/vendor",
]

[tool.ruff]
extend-exclude = [
    "runner/evals/iheval_programmatic/vendor",
    "runner/helpers/vera_mh_result/vendor",
]

[tool.ruff.lint]
# Enable linting rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
]
ignore = [
    "E501", # Line too long
]

[tool.ruff.lint.per-file-ignores]
"runner/evals/cogmanip_judge/prompts.py" = ["W291"]  # verbatim upstream prompt

[tool.ruff.lint.mccabe]
max-complexity = 93

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "privileged: needs root to setuid the sandbox to nobody; CI runs these under sudo",
    "live: calls a real model provider; CI runs these in their own job, which holds the provider credentials",
]
