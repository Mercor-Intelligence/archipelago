[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["mcp_servers/chat_server/tests"]
pythonpath = ["mcp_servers/chat_server"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["mcp_servers/chat_server/tools"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[project]
name = "mercor-rls-chat"
version = "0.1.0"
description = "Mercor RLS Mattermost MCP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aioboto3>=15.4.0",
    "aiobotocore>=2.25.0",
    "asyncer>=0.0.9",
    "asyncpg>=0.30.0",
    "datadog-api-client>=2.44.0",
    "fastmcp>=3.3.1,<3.4",
    "httpx>=0.27.0",
    "litellm==1.108.3",
    "loguru>=0.7.3",
    "mcp-middleware",
    "mcp-schema",
    "pydantic-settings>=2.11.0",
    "redis>=6.4.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31.6",
    "ruff>=0.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
reportUnusedCallResult = "none"
failOnWarnings = false
exclude = ["scripts", "packages", "modal_labs.py", "modal_helpers.py", ".venv", ".git", ".tmp", "venv", "mcp_servers", "smoke_test"]

[tool.ruff.lint]
# Enable linting rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

ignore = [
    "E501",  # Line too long
]


[tool.uv]
# litellm 1.83.4+ pins python-dotenv==1.0.1 while fastmcp requires >=1.1.0;
# override to break the conflict (runtime works fine with python-dotenv 1.1.x).
# litellm 1.108.3 needs boto3>=1.43.117, above what aioboto3's pinned aiobotocore
# 2.25.x allows; take the aiobotocore line that tracks that botocore range.
override-dependencies = ["python-dotenv>=1.0.1", "aiobotocore[boto3]>=3.10.0"]
#
# ones are refused as critical CVEs, so a re-lock must not drop below them.
constraint-dependencies = [
    "anyio>=4.15.1",
    "authlib>=1.9.1",
    "certifi>=2026.10.23",
    "pyjwt>=2.15.1",
]

[tool.uv.sources]
mcp-schema = { path = "packages/mcp_schema" }
mcp-middleware = { path = "packages/mcp_middleware" }
