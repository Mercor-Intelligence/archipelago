[project]
name = "mcp-cache"
version = "1.0.0"
description = "HTTP caching middleware for FastMCP servers with ETag and Last-Modified validation"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Mercor", email = "support@mercor.com" }
]
keywords = ["mcp", "cache", "http", "middleware", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.21.0",
    "ruff>=0.6.0",
    "respx>=0.20.0",  # For mocking httpx
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_cache*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.uv]
#
# These versions are the oldest the firewall still serves; everything below
# them is refused as a critical CVE, so a re-lock must not drop under them.
constraint-dependencies = [
    "anyio>=4.15.1",
    "certifi>=2026.10.23",
]
# Resolve only releases the firewall has had time to scan (>= 7 days old at
# migration time). Raise the date to deliberately take newer releases.
exclude-newer = "2026-10-24T00:00:00Z"
# --- end package firewall ---

# Public PyPI through the Socket package firewall. The login comes from ~/.netrc
# (CI writes it from the SOCKET_FIREWALL_GATE_TOKEN secret); never commit a token.
[[tool.uv.index]]
name = "firewall"
url = "https://pypi.org/simple"
default = true
