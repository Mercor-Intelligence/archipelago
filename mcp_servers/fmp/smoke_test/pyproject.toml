[project]
name = "fmp-smoke-test"
version = "0.1.0"
description = "Smoke tests for Fmp MCP server"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "fastmcp>=3.3.1,<3.4",
    "testcontainers>=4.0.0",
    "tomli>=2.0.0",
    "litellm==1.106.5",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = ["basedpyright>=1.31.6", "ruff>=0.8.0"]

[tool.uv]
# litellm 1.83.4+ pins python-dotenv==1.0.1 while fastmcp requires >=1.1.0;
# override to break the conflict (runtime works fine with python-dotenv 1.1.x).
override-dependencies = ["python-dotenv>=1.0.1"]
# fastmcp 3 caps neither starlette nor mcp, so an unconstrained relock drifts
# onto the starlette 1.x major. Hold both where `main` has them.
constraint-dependencies = ["starlette<1", "mcp<1.26"]

[tool.basedpyright]
typeCheckingMode = "recommended"
failOnWarnings = false
reportUnusedCallResult = "none"
reportMissingTypeArgument = "none"
reportMissingImports = "warning"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportImplicitStringConcatenation = "none"
reportMissingTypeStubs = "none"

[[tool.uv.index]]
name = "firewall"
url = "https://pypi.org/simple"
default = true
